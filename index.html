    // =========================================================================
    // APLIKASI UTAMA XANDRE
    // =========================================================================
    const NAV_ITEMS = [
      { id: 'home', label: 'Home' },
      { id: 'learn', label: 'Learn' },
      { id: 'flashcards', label: 'Flashcards' },
      { id: 'assessment', label: 'Assessment' },
      { id: 'videos', label: 'Video Library' },
      { id: 'quiz', label: 'Quiz Center' },
      { id: 'cyber-lab', label: 'Cyber Lab' },
      { id: 'password-breaker', label: 'Password Breaker' },
      { id: 'challenges', label: 'Challenges' },
      { id: 'profile', label: 'Profil' },
    ];

    function App() {
      const [identity, setIdentity] = useState(() => loadIdentity());
      const [progress, setProgress] = useState(() => loadProgress());
      const [activeRoute, setActiveRoute] = useState('home');
      const [activeVideoId, setActiveVideoId] = useState(null);
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

      const [editingNickname, setEditingNickname] = useState(false);
      const [newNicknameVal, setNewNicknameVal] = useState('');
      const [nickError, setNickError] = useState('');
      const [welcomeBanner, setWelcomeBanner] = useState(null);

      useEffect(() => {
        const today = getTodayDateKey();
        setProgress((prev) => {
          let updated = { ...prev };
          if (updated.lastActiveDate !== today) {
            const isYesterday =
              updated.lastActiveDate &&
              (() => {
                const prevDate = new Date(`${updated.lastActiveDate}T00:00:00`);
                const nowDate = new Date(`${today}T00:00:00`);
                const diffDays = Math.round((nowDate - prevDate) / (1000 * 60 * 60 * 24));
                return diffDays === 1;
              })();
            updated.streakCount = isYesterday ? (updated.streakCount || 1) + 1 : updated.lastActiveDate ? 1 : 1;
            updated.lastActiveDate = today;
          }
          updated.unlockedBadges = evaluateUnlockedBadges(updated);
          saveProgress(updated);
          return updated;
        });
      }, []);

      const commitProgressUpdate = useCallback((updaterFn) => {
        setProgress((prev) => {
          const nextRaw = typeof updaterFn === 'function' ? updaterFn(prev) : { ...prev, ...updaterFn };
          const nextWithBadges = {
            ...nextRaw,
            lastActiveDate: getTodayDateKey(),
            unlockedBadges: evaluateUnlockedBadges(nextRaw),
          };
          saveProgress(nextWithBadges);
          return nextWithBadges;
        });
      }, []);

      function handleEnterXandre(cleanedNick) {
        const nextIdentity = {
          nickname: cleanedNick,
          joinedAt: identity.joinedAt || getTodayDateKey(),
        };
        saveIdentity(nextIdentity);
        setIdentity(nextIdentity);
        setActiveRoute('home');
        setWelcomeBanner({
          title: `YOU'RE IN, ${cleanedNick}!`,
          subtitle: "Welcome to XandRE. Let's make your digital world safer.",
        });
      }

      function handleSaveChangedNickname(e) {
        if (e) e.preventDefault();
        const cleaned = newNicknameVal.replace(/\s+/g, ' ').trim();
        if (!cleaned || cleaned.length < 2 || cleaned.length > 20) {
          setNickError('Nickname harus 2–20 karakter dan tidak kosong.');
          return;
        }
        const nextIdentity = {
          ...identity,
          nickname: cleaned,
        };
        saveIdentity(nextIdentity);
        setIdentity(nextIdentity);
        setEditingNickname(false);
        setNickError('');
        setWelcomeBanner({
          title: `YOU'RE IN, ${cleaned}!`,
          subtitle: 'Nickname diperbarui tanpa menghapus progres belajarmu.',
        });
      }

      function handleLogout() {
        const clearedIdentity = {
          nickname: null,
          joinedAt: identity.joinedAt,
        };
        saveIdentity(clearedIdentity);
        setIdentity(clearedIdentity);
        setMobileMenuOpen(false);
        setEditingNickname(false);
        setWelcomeBanner(null);
      }

      const handleCompleteLesson = useCallback((lesson) => {
        commitProgressUpdate((prev) => {
          const done = prev.completedLessons || [];
          if (done.includes(lesson.id)) return prev;
          const xpGain = 40;
          return {
            ...prev,
            xp: (prev.xp || 0) + xpGain,
            completedLessons: [...done, lesson.id],
            activityLog: [
              {
                id: `act-${Date.now()}-${lesson.id}`,
                title: `Menyelesaikan materi: ${lesson.title}`,
                category: lesson.category,
                xp: xpGain,
                timestamp: getTodayDateKey(),
              },
              ...(prev.activityLog || []),
            ],
          };
        });
      }, [commitProgressUpdate]);

      const handleRateFlashcard = useCallback((cardId, ratingLabel) => {
        commitProgressUpdate((prev) => {
          const already = (prev.flashcardsReviewed || []).includes(cardId);
          const xpGain = already ? 0 : 15;
          return {
            ...prev,
            xp: (prev.xp || 0) + xpGain,
            flashcardsReviewed: already ? prev.flashcardsReviewed : [...(prev.flashcardsReviewed || []), cardId],
            flashcardConfidence: {
              ...(prev.flashcardConfidence || {}),
              [cardId]: ratingLabel,
            },
            activityLog: xpGain > 0
              ? [
                  {
                    id: `act-${Date.now()}-${cardId}`,
                    title: `Meninjau flashcard (${ratingLabel})`,
                    category: 'Flashcards',
                    xp: xpGain,
                    timestamp: getTodayDateKey(),
                  },
                  ...(prev.activityLog || []),
                ]
              : prev.activityLog,
          };
        });
      }, [commitProgressUpdate]);

      const handleSubmitAssessment = useCallback((resultObj) => {
        commitProgressUpdate((prev) => {
          const firstTimeBonus = prev.assessmentResult ? 20 : 50;
          return {
            ...prev,
            xp: (prev.xp || 0) + firstTimeBonus,
            assessmentResult: resultObj,
            diagnosticHistory: [resultObj, ...(prev.diagnosticHistory || [])],
            activityLog: [
              {
                id: `act-${Date.now()}-diag`,
                title: `Diagnostic Assessment (${resultObj.level})`,
                category: 'Assessment',
                xp: firstTimeBonus,
                timestamp: getTodayDateKey(),
              },
              ...(prev.activityLog || []),
            ],
          };
        });
      }, [commitProgressUpdate]);

      const handleFinishQuiz = useCallback((summary) => {
        commitProgressUpdate((prev) => ({
          ...prev,
          xp: (prev.xp || 0) + summary.xpEarned,
          quizHistory: [summary, ...(prev.quizHistory || [])],
          activityLog: [
            {
              id: `act-${Date.now()}-${summary.id}`,
              title: `Kuis ${summary.mode} (${summary.score}/${summary.total})`,
              category: 'Quiz Center',
              xp: summary.xpEarned,
              timestamp: getTodayDateKey(),
            },
            ...(prev.activityLog || []),
          ],
        }));
      }, [commitProgressUpdate]);

      const handleCompleteLab = useCallback((labId, scoreVal, maxVal, xpReward) => {
        commitProgressUpdate((prev) => {
          const alreadyDone = (prev.completedCyberLabs || []).includes(labId);
          const actualXp = alreadyDone ? 0 : xpReward;
          return {
            ...prev,
            xp: (prev.xp || 0) + actualXp,
            completedCyberLabs: alreadyDone
              ? prev.completedCyberLabs
              : [...(prev.completedCyberLabs || []), labId],
            labCompleted: {
              ...(prev.labCompleted || {}),
              [labId]: { score: scoreVal, maxScore: maxVal, xpEarned: xpReward },
            },
            activityLog: actualXp > 0
              ? [
                  {
                    id: `act-${Date.now()}-${labId}`,
                    title: `Menyelesaikan simulasi ${labId}`,
                    category: 'Cyber Lab',
                    xp: actualXp,
                    timestamp: getTodayDateKey(),
                  },
                  ...(prev.activityLog || []),
                ]
              : prev.activityLog,
          };
        });
      }, [commitProgressUpdate]);

      const handleWinPasswordBreaker = useCallback((summary) => {
        commitProgressUpdate((prev) => {
          const currentBest = (prev.passwordBreaker && prev.passwordBreaker.bestScore) || 0;
          const currentWins = (prev.passwordBreaker && prev.passwordBreaker.wins) || 0;
          const isDaily = summary.mode === 'daily';
          const today = getTodayDateKey();
          const alreadyClaimedDaily = isDaily && prev.passwordBreaker?.dailyCompletedDate === today;

          const xpGain = alreadyClaimedDaily ? Math.round(summary.xpReward * 0.25) : summary.xpReward;

          return {
            ...prev,
            xp: (prev.xp || 0) + xpGain,
            passwordBreaker: {
              bestScore: Math.max(currentBest, summary.score),
              wins: currentWins + 1,
              dailyCompletedDate: isDaily ? today : (prev.passwordBreaker?.dailyCompletedDate || null),
            },
            activityLog: [
              {
                id: `act-${Date.now()}-pb`,
                title: `Memecahkan kode Password Breaker (${summary.level})`,
                category: 'Password Breaker',
                xp: xpGain,
                timestamp: today,
              },
              ...(prev.activityLog || []),
            ],
          };
        });
      }, [commitProgressUpdate]);

      const handleToggleFavoriteVideo = useCallback((videoId) => {
        commitProgressUpdate((prev) => {
          const favs = prev.favoriteVideos || [];
          const exists = favs.includes(videoId);
          return {
            ...prev,
            favoriteVideos: exists ? favs.filter((id) => id !== videoId) : [...favs, videoId],
          };
        });
      }, [commitProgressUpdate]);

      const handleMarkVideoWatched = useCallback((videoId) => {
        commitProgressUpdate((prev) => {
          const watched = prev.watchedVideos || [];
          const recent = (prev.recentlyWatchedVideos || []).filter((id) => id !== videoId);
          const nextRecent = [videoId, ...recent].slice(0, 10);

          if (watched.includes(videoId)) {
            return {
              ...prev,
              recentlyWatchedVideos: nextRecent,
            };
          }

          const xpGain = 45;
          const vidObj = CURATED_VIDEOS.find((v) => v.id === videoId);
          return {
            ...prev,
            xp: (prev.xp || 0) + xpGain,
            watchedVideos: [...watched, videoId],
            recentlyWatchedVideos: nextRecent,
            activityLog: [
              {
                id: `act-${Date.now()}-${videoId}`,
                title: `Menonton video: ${vidObj ? vidObj.title : videoId}`,
                category: 'Video Library',
                xp: xpGain,
                timestamp: getTodayDateKey(),
              },
              ...(prev.activityLog || []),
            ],
          };
        });
      }, [commitProgressUpdate]);

      const handleClaimChallenge = useCallback((ch) => {
        commitProgressUpdate((prev) => {
          const done = prev.completedChallenges || [];
          if (done.includes(ch.id)) return prev;
          return {
            ...prev,
            xp: (prev.xp || 0) + ch.xp,
            completedChallenges: [...done, ch.id],
            activityLog: [
              {
                id: `act-${Date.now()}-${ch.id}`,
                title: `Tantangan selesai: ${ch.title}`,
                category: 'Challenges',
                xp: ch.xp,
                timestamp: getTodayDateKey(),
              },
              ...(prev.activityLog || []),
            ],
          };
        });
      }, [commitProgressUpdate]);

      if (!identity || !identity.nickname) {
        return (
          <GatePassScreen
            initialNickname={identity?.nickname || ''}
            onEnterXandre={handleEnterXandre}
          />
        );
      }

      const levelInfo = computeLevelInfo(progress.xp || 0);

      function navigateTo(routeId) {
        setActiveRoute(routeId);
        setMobileMenuOpen(false);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      return (
        <div className="min-h-screen bg-ivory text-charcoal flex flex-col">
          <header className="sticky top-0 z-30 bg-ivory/95 backdrop-blur border-b border-charcoal/15">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
              <div className="flex items-center gap-3">
                <button
                  type="button"
                  onClick={() => setMobileMenuOpen((o) => !o)}
                  aria-label="Buka atau tutup menu navigasi"
                  className="lg:hidden rounded-xl bg-ivorySoft hover:bg-ivoryDeep border border-charcoal/20 px-3 py-2 text-xs font-bold cursor-pointer"
                >
                  {mobileMenuOpen ? '✕' : '☰'}
                </button>

                <button
                  type="button"
                  onClick={() => navigateTo('home')}
                  className="text-left flex items-baseline gap-2 cursor-pointer"
                >
                  <span className="font-display text-xl sm:text-2xl font-bold tracking-tight">XandRE</span>
                  <span className="hidden sm:inline text-[10px] font-bold uppercase tracking-widest text-coralDark">
                    THINK SMART. STAY SECURE.
                  </span>
                </button>
              </div>

              <div className="flex items-center gap-2 text-xs">
                <span className="hidden md:inline-flex items-center gap-1.5 rounded-full bg-sage/35 px-3 py-1 font-semibold">
                  <span>{identity.nickname}</span>
                  <span>•</span>
                  <span>{levelInfo.name}</span>
                  <span>•</span>
                  <strong className="text-coralDark">{progress.xp || 0} XP</strong>
                </span>

                <button
                  type="button"
                  onClick={() => {
                    setNewNicknameVal(identity.nickname);
                    setNickError('');
                    setEditingNickname(true);
                  }}
                  className="rounded-xl bg-ivorySoft hover:bg-ivoryDeep border border-charcoal/20 px-3 py-1.5 font-semibold cursor-pointer"
                >
                  Change Nickname
                </button>

                <button
                  type="button"
                  onClick={handleLogout}
                  className="rounded-xl bg-charcoal hover:bg-coral text-ivory px-3 py-1.5 font-semibold transition-colors cursor-pointer"
                >
                  Logout
                </button>
              </div>
            </div>
          </header>

          {editingNickname && (
            <div className="fixed inset-0 z-50 bg-charcoal/60 flex items-center justify-center p-4">
              <div className="w-full max-w-md rounded-2xl bg-ivorySoft border border-charcoal/20 p-6 shadow-editorial space-y-4 animate-fade-up">
                <h2 className="font-display text-xl font-bold">Change Nickname</h2>
                <p className="text-xs text-charcoal/70">
                  Mengganti nickname tidak akan menghapus XP, level, badge, maupun progres belajarmu.
                </p>
                <form onSubmit={handleSaveChangedNickname} className="space-y-3">
                  <input
                    type="text"
                    maxLength={25}
                    value={newNicknameVal}
                    onChange={(e) => setNewNicknameVal(e.target.value)}
                    placeholder="Enter your nickname..."
                    className="w-full rounded-xl bg-ivory border border-charcoal/25 px-4 py-2.5 text-sm font-medium"
                  />
                  {nickError && <p className="text-xs text-coralDark font-semibold">{nickError}</p>}
                  <div className="flex justify-end gap-2 pt-1">
                    <button
                      type="button"
                      onClick={() => setEditingNickname(false)}
                      className="rounded-xl bg-ivoryDeep px-4 py-2 text-xs font-bold cursor-pointer"
                    >
                      Batal
                    </button>
                    <button
                      type="submit"
                      className="rounded-xl bg-coral hover:bg-coralDark text-ivory px-4 py-2 text-xs font-bold cursor-pointer"
                    >
                      Simpan Nickname
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {welcomeBanner && (
            <div className="max-w-7xl w-full mx-auto px-4 sm:px-6 pt-4">
              <div className="rounded-2xl bg-charcoal text-ivory px-5 py-3.5 flex items-center justify-between gap-4 shadow-card animate-fade-up">
                <div>
                  <div className="font-display font-bold text-sm sm:text-base text-sage">
                    {welcomeBanner.title}
                  </div>
                  <div className="text-xs text-ivory/80">{welcomeBanner.subtitle}</div>
                </div>
                <button
                  type="button"
                  onClick={() => setWelcomeBanner(null)}
                  className="text-xs text-ivory/70 hover:text-ivory font-bold px-2 py-1 cursor-pointer"
                >
                  ✕
                </button>
              </div>
            </div>
          )}

          <div className="max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            <aside
              className={`lg:col-span-3 rounded-2xl bg-ivorySoft border border-charcoal/15 p-3 shadow-card lg:sticky lg:top-20 ${
                mobileMenuOpen ? 'block' : 'hidden lg:block'
              }`}
            >
              <div className="text-[11px] font-bold uppercase tracking-widest text-charcoal/55 px-3 py-2">
                Menu Navigasi ({NAV_ITEMS.length})
              </div>
              <nav aria-label="Navigasi utama XandRE" className="space-y-1">
                {NAV_ITEMS.map((item, idx) => {
                  const active = activeRoute === item.id;
                  return (
                    <button
                      key={item.id}
                      type="button"
                      onClick={() => navigateTo(item.id)}
                      className={`w-full text-left rounded-xl px-3.5 py-2.5 text-xs sm:text-sm font-display font-semibold flex items-center justify-between transition-colors cursor-pointer ${
                        active
                          ? 'bg-charcoal text-ivory'
                          : 'text-charcoal/85 hover:bg-ivoryDeep/80'
                      }`}
                    >
                      <span>
                        <span className="text-[11px] opacity-60 mr-2">{idx + 1}.</span>
                        {item.label}
                      </span>
                      {active && <span className="text-coral text-xs">●</span>}
                    </button>
                  );
                })}
              </nav>
            </aside>

            <main className="lg:col-span-9 min-w-0">
              {activeRoute === 'home' && (
                <HomePage
                  nickname={identity.nickname}
                  progress={progress}
                  onNavigate={navigateTo}
                  onSelectVideoId={(vidId) => setActiveVideoId(vidId)}
                />
              )}

              {activeRoute === 'learn' && (
                <LearnPage
                  progress={progress}
                  onCompleteLesson={handleCompleteLesson}
                  onNavigateToVideo={(vidId) => {
                    setActiveVideoId(vidId);
                    navigateTo('videos');
                  }}
                />
              )}

              {activeRoute === 'flashcards' && (
                <FlashcardsPage
                  progress={progress}
                  onRateFlashcard={handleRateFlashcard}
                />
              )}

              {activeRoute === 'assessment' && (
                <AssessmentPage
                  progress={progress}
                  onSubmitAssessment={handleSubmitAssessment}
                  onNavigate={navigateTo}
                />
              )}

              {activeRoute === 'quiz' && (
                <QuizCenterPage
                  progress={progress}
                  onFinishQuiz={handleFinishQuiz}
                />
              )}

              {activeRoute === 'cyber-lab' && (
                <CyberLabPage
                  progress={progress}
                  onCompleteLab={handleCompleteLab}
                />
              )}

              {activeRoute === 'password-breaker' && (
                <PasswordBreakerPage
                  progress={progress}
                  onWinPasswordBreaker={handleWinPasswordBreaker}
                />
              )}

              {activeRoute === 'videos' && (
                <VideoLibraryPage
                  progress={progress}
                  activeVideoId={activeVideoId}
                  onSelectVideoId={(vidId) => setActiveVideoId(vidId)}
                  onToggleFavoriteVideo={handleToggleFavoriteVideo}
                  onMarkVideoWatched={handleMarkVideoWatched}
                />
              )}

              {activeRoute === 'challenges' && (
                <ChallengesPage
                  progress={progress}
                  onClaimChallenge={handleClaimChallenge}
                />
              )}

              {(activeRoute === 'profile' || activeRoute === 'progress' || activeRoute === 'achievements') && (
                <ProfilePage
                  nickname={identity.nickname}
                  joinedAt={identity.joinedAt}
                  progress={progress}
                  onOpenChangeNickname={() => {
                    setNewNicknameVal(identity.nickname);
                    setNickError('');
                    setEditingNickname(true);
                  }}
                  onLogout={handleLogout}
                />
              )}
            </main>
          </div>

          <footer className="border-t border-charcoal/15 bg-ivorySoft/70 py-5 px-4 sm:px-6 text-xs text-charcoal/70">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
              <div className="font-display font-bold text-charcoal">
                XandRE — THINK SMART. STAY SECURE.
              </div>
              <div>Digital Intelligence &amp; Cybersecurity Learning Platform</div>
            </div>
            <div className="max-w-7xl mx-auto mt-2 pt-2 border-t border-charcoal/10 text-center text-[11px] font-medium text-charcoal/60">
              Alexander samuel parulian
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
