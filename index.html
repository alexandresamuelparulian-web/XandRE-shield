      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');

    function loadIdentity() {
      try {
        const raw = localStorage.getItem(IDENTITY_STORAGE_KEY);
        if (!raw) return { nickname: null, joinedAt: null };
        const parsed = JSON.parse(raw);
        const nick = typeof parsed.nickname === 'string' && parsed.nickname.trim().length >= 2
          ? parsed.nickname.replace(/\s+/g, ' ').trim().slice(0, 20)
          : null;
        return {
          nickname: nick,
          joinedAt: parsed.joinedAt || null,
        };
      } catch (_) {
        return { nickname: null, joinedAt: null };
      }
    }

    function saveIdentity(identityObj) {
      try {
        localStorage.setItem(IDENTITY_STORAGE_KEY, JSON.stringify(identityObj));
      } catch (_) {}
    }

    function loadProgress() {
      try {
        const raw = localStorage.getItem(PROGRESS_STORAGE_KEY);
        const base = createDefaultProgress();
        if (!raw) return base;
        const parsed = JSON.parse(raw);
        return {
          ...base,
          ...parsed,
          passwordBreaker: {
            ...base.passwordBreaker,
            ...(parsed.passwordBreaker || {}),
          },
          flashcardConfidence: {
            ...base.flashcardConfidence,
            ...(parsed.flashcardConfidence || {}),
          },
          labCompleted: {
            ...base.labCompleted,
            ...(parsed.labCompleted || {}),
          },
          unlockedBadges: {
            ...base.unlockedBadges,
            ...(parsed.unlockedBadges || {}),
          },
        };
      } catch (_) {
        return createDefaultProgress();
      }
    }

    function saveProgress(progressObj) {

    function computeLevelInfo(xp) {
      const tiers = [
        { name: 'Beginner', minXp: 0, nextXp: 100 },
        { name: 'Explorer', minXp: 100, nextXp: 250 },
        { name: 'Defender', minXp: 250, nextXp: 450 },
        { name: 'Specialist', minXp: 450, nextXp: 700 },
        { name: 'Expert', minXp: 700, nextXp: 1000 },
        { name: 'Master', minXp: 1000, nextXp: 1500 },
      ];

      let current = tiers[0];
      for (const tier of tiers) {
        if (xp >= tier.minXp) {
          current = tier;
        }
      }

      const span = Math.max(1, current.nextXp - current.minXp);
      const pct = current.name === 'Master'
        ? 100
        : Math.min(100, Math.max(0, Math.round(((xp - current.minXp) / span) * 100)));

      return {
        name: current.name,
        minXp: current.minXp,
        nextXp: current.nextXp,
        pct,
      };
    }

    function evaluatePasswordStrengthLocal(pw) {
      if (!pw) {
        return { score: 0, label: 'Belum Diuji', colorClass: 'bg-charcoal/20', tips: ['Ketikkan contoh kata sandi uji coba untuk melihat analisis lokalnya.'] };
      }
      let points = 0;
      const tips = [];

      if (pw.length >= 8) points += 20;
      else tips.push('Tambahkan panjang sandi hingga minimal 8–12+ karakter.');

      if (pw.length >= 12) points += 20;
      if (/[a-z]/.test(pw)) points += 15;
      else tips.push('Gunakan huruf kecil.');

      if (/[A-Z]/.test(pw)) points += 15;
      else tips.push('Tambahkan huruf kapital agar lebih bervariasi.');

      if (/[0-9]/.test(pw)) points += 15;
      else tips.push('Tambahkan angka.');

      if (/[^A-Za-z0-9]/.test(pw)) points += 15;
      else tips.push('Tambahkan simbol seperti !, @, #, atau $.');

      const commonPatterns = ['1234', 'password', 'qwerty', 'admin', 'abc123', 'iloveyou'];
      if (commonPatterns.some((p) => pw.toLowerCase().includes(p))) {
        points = Math.max(10, points - 35);
        tips.push('Hindari pola umum seperti "1234", "qwerty", atau "password".');
      }

      const clamped = Math.min(100, Math.max(5, points));
      if (clamped < 40) {
        return { score: clamped, label: 'Lemah', colorClass: 'bg-coral', tips };
      }
      if (clamped < 75) {
        return { score: clamped, label: 'Sedang', colorClass: 'bg-amber-500', tips };
      }
      return {
        score: clamped,
        label: 'Kuat',
        colorClass: 'bg-sageDark',
        tips: tips.length ? tips : ['Kombinasi panjang dan variasi karakternya sudah cukup kuat!'],
      };
    }

    function buildPasswordPool(levelCfg, mode, shapeId) {
      const selectedShape = PB_SHAPES.find((s) => s.id === shapeId);
      if (selectedShape && selectedShape.chars) {
        return selectedShape.chars;
      }
      if (mode === 'daily') {
        return 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#';
      }
      return levelCfg.charset;
    }

    function generateSecretCode(levelCfg, mode, shapeId = 'mixed') {
      const pool = buildPasswordPool(levelCfg, mode, shapeId);

      if (mode === 'daily' && shapeId === 'mixed') {
        const key = getTodayDateKey();
        let hash = 0;
        for (let i = 0; i < key.length; i++) {
          hash = (hash * 31 + key.charCodeAt(i)) >>> 0;
        }
        let code = '';
        for (let i = 0; i < 5; i++) {
          const idx = (hash + i * 17) % pool.length;
          code += pool[idx];
          hash = (hash * 1664525 + 1013904223 + i) >>> 0;
        }
        return code;
      }

      let out = '';
      for (let i = 0; i < levelCfg.length; i++) {
        const randIdx = Math.floor(Math.random() * pool.length);
        out += pool[randIdx];
      }
      return out;
    }

    function evaluateMastermindGuess(secret, guess) {
      const len = secret.length;
      let exact = 0;
      const secretRemaining = [];
      const guessRemaining = [];

      for (let i = 0; i < len; i++) {
        if (secret[i] === guess[i]) {
          exact++;
        } else {
          secretRemaining.push(secret[i]);
          guessRemaining.push(guess[i]);
        }
      }

      let partial = 0;
      const freq = {};
      for (const ch of secretRemaining) {
        freq[ch] = (freq[ch] || 0) + 1;
      }
      for (const ch of guessRemaining) {
        if (freq[ch] && freq[ch] > 0) {
          partial++;
          freq[ch]--;
        }
      }

      return { exact, partial };
    }

    function analyzeSecretComposition(secret) {
      const hasUpper = /[A-Z]/.test(secret);
      const hasLower = /[a-z]/.test(secret);
      const hasDigit = /[0-9]/.test(secret);
      const hasSymbol = /[^A-Za-z0-9]/.test(secret);
      const types = [];
      if (hasUpper) types.push('Huruf Kapital');
      if (hasLower) types.push('Huruf Kecil');
      if (hasDigit) types.push('Angka');
      if (hasSymbol) types.push('Simbol');

      return {
        length: secret.length,
        hasUpper,
        hasLower,
        hasDigit,
        hasSymbol,
        types: types.length ? types : ['Karakter'],
        firstCharPreview: secret[0] || '-',
      };
    }

    function FlashcardsPage({ progress, onRateFlashcard }) {
      const [categoryFilter, setCategoryFilter] = useState('Semua');
      const [deck, setDeck] = useState(FLASHCARDS);
      const [index, setIndex] = useState(0);
      const [flipped, setFlipped] = useState(false);

      useEffect(() => {
        const base =
          categoryFilter === 'Semua'
            ? FLASHCARDS
            : FLASHCARDS.filter((c) => c.category === categoryFilter);
        setDeck(base.length ? base : FLASHCARDS);
        setIndex(0);
        setFlipped(false);
      }, [categoryFilter]);

      function handleShuffle() {
        const copy = [...deck];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        setDeck(copy);
        setIndex(0);
        setFlipped(false);
      }

      const card = deck[index] || FLASHCARDS[0];
      const reviewedCount = (progress.flashcardsReviewed || []).length;
      const confidenceLabel = (progress.flashcardConfidence || {})[card.id];

      return (
        <div className="space-y-6 animate-fade-up">
          <div className="rounded-2xl bg-ivorySoft border border-charcoal/15 p-6 flex flex-wrap items-center justify-between gap-4 shadow-card">

            <button
              type="button"
              onClick={handleShuffle}

            >
              ↻ Randomize Cards
            </button>
          </div>

          <div className="flex flex-wrap gap-2">
            <button
              type="button"
              onClick={() => setCategoryFilter('Semua')}
              className={`rounded-full px-3.5 py-1.5 text-xs font-semibold cursor-pointer ${
                categoryFilter === 'Semua'
                  ? 'bg-charcoal text-ivory'
                  : 'bg-ivorySoft hover:bg-ivoryDeep text-charcoal border border-charcoal/15'
              }`}
            >
              Semua Kategori
            </button>
            {LEARNING_CATEGORIES.map((cat) => (
              <button
                key={cat}
                type="button"
                onClick={() => setCategoryFilter(cat)}
                className={`rounded-full px-3.5 py-1.5 text-xs font-semibold cursor-pointer ${
                  categoryFilter === cat

                    : 'bg-ivorySoft hover:bg-ivoryDeep text-charcoal border border-charcoal/15'
                }`}
              >
                {cat}
              </button>
            ))}
          </div>

          <div
            onClick={() => setFlipped((f) => !f)}
            className="perspective-1000 cursor-pointer select-none"
          >
            <div
              className={`relative min-h-[260px] sm:min-h-[290px] w-full transition-transform duration-500 preserve-3d ${
                flipped ? 'rotate-y-180' : ''
              }`}
            >
              <div className="backface-hidden rounded-3xl bg-ivorySoft border border-charcoal/20 p-6 sm:p-10 flex flex-col justify-between min-h-[260px] sm:min-h-[290px] shadow-editorial">
                <div className="flex items-center justify-between text-xs font-bold">
                  <span className="text-coralDark">{card.category}</span>
                  <span className="text-charcoal/55">PERTANYAAN • Klik untuk membalik</span>
                </div>

                <h2 className="font-display text-xl sm:text-2xl font-bold text-center my-4 leading-snug">
                  {card.front}
                </h2>

                <div className="text-center text-xs text-charcoal/60">
                  {confidenceLabel ? `Status terakhir: ${confidenceLabel}` : 'Belum dinilai'}

                  <span className="text-ivory/60">JAWABAN &amp; PENJELASAN</span>
                </div>

                <div className="space-y-3 my-auto">
                  <p className="font-display text-lg sm:text-xl font-bold text-ivory leading-snug">
                    {card.back}
                  </p>
                  <p className="text-xs sm:text-sm text-ivory/80 leading-relaxed">
                    {card.explanation}
                  </p>
                </div>

                <div className="text-center text-[11px] text-ivory/55">

    // =========================================================================
    // HALAMAN DIAGNOSTIC ASSESSMENT (/assessment)
    // =========================================================================
    function AssessmentPage({ progress, onSubmitAssessment, onNavigate }) {
      const [answers, setAnswers] = useState({});
      const [latestResult, setLatestResult] = useState(progress.assessmentResult || null);

      function handleSelect(qId, optIdx) {
        setAnswers((prev) => ({ ...prev, [qId]: optIdx }));
      }

      function handleGrade() {
        let correctCount = 0;
        const weakMap = {};

        for (const q of DIAGNOSTIC_QUESTIONS) {
          if (answers[q.id] === q.correct) {
            correctCount++;
          } else {
            weakMap[q.category] = (weakMap[q.category] || 0) + 1;
          }
        }

        const total = DIAGNOSTIC_QUESTIONS.length;
        const pct = Math.round((correctCount / total) * 100);
        const level = pct >= 80 ? 'Advanced' : pct >= 50 ? 'Intermediate' : 'Beginner';
        const weaknesses = Object.entries(weakMap)
          .sort((a, b) => b[1] - a[1])
          .map(([cat]) => cat);

        const recommendedCategories =
          weaknesses.length > 0 ? weaknesses.slice(0, 3) : ['Cybersecurity Fundamentals', 'Digital Privacy'];

        const resultObj = {
          score: correctCount,
          total,
          percentage: pct,
          level,
          weaknesses,
          recommendedCategories,
          date: getTodayDateKey(),
        };

        setLatestResult(resultObj);
        onSubmitAssessment(resultObj);
      }

      const answeredCount = Object.keys(answers).length;

      return (
        <div className="space-y-6 animate-fade-up">
          <div className="rounded-2xl bg-ivorySoft border border-charcoal/15 p-6 shadow-card">
            <span className="text-xs font-bold uppercase tracking-widest text-coralDark">DIAGNOSTIC ASSESSMENT</span>
            <h1 className="font-display text-2xl sm:text-3xl font-bold mt-1">
              Tes Diagnostik Pemahaman Keamanan Digital ({DIAGNOSTIC_QUESTIONS.length} Soal)
            </h1>
            <p className="text-xs sm:text-sm text-charcoal/70 mt-1">
              Terjawab: {answeredCount}/{DIAGNOSTIC_QUESTIONS.length} soal • Hasil otomatis diklasifikasikan ke Beginner, Intermediate, atau Advanced.
            </p>
          </div>

          {latestResult && (
            <div className="rounded-2xl bg-charcoal text-ivory p-6 space-y-4 shadow-editorial">
              <div className="flex flex-wrap items-center justify-between gap-2">
                <div>
                  <div className="text-xs font-bold uppercase tracking-wider text-sage">
                    Hasil Diagnostik Tersimpan ({latestResult.date})
                  </div>
                  <h2 className="font-display text-2xl font-bold mt-1">
                    Skor: {latestResult.score}/{latestResult.total} ({latestResult.percentage}%) —{' '}
                    <span className="text-coral">{latestResult.level}</span>
                  </h2>
                </div>
                <button
                  type="button"
                  onClick={() => onNavigate('learn')}
                  className="rounded-xl bg-coral hover:bg-coralDark text-ivory font-display font-bold text-xs sm:text-sm px-4 py-2.5 cursor-pointer"
                >
                  Pelajari Rekomendasi →
                </button>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs sm:text-sm">
                <div className="rounded-xl bg-charcoalSoft p-4 border border-ivory/10">
                  <div className="font-bold text-coral mb-1">Analisis Kelemahan</div>
                  {latestResult.weaknesses && latestResult.weaknesses.length > 0 ? (
                    <p className="text-ivory/85">
                      Topik yang perlu diperkuat: <strong>{latestResult.weaknesses.join(', ')}</strong>.
                    </p>
                  ) : (
                    <p className="text-sage">Luar biasa! Tidak ada kelemahan signifikan pada tes ini.</p>
                  )}
                </div>

                <div className="rounded-xl bg-charcoalSoft p-4 border border-ivory/10">
                  <div className="font-bold text-sage mb-1">Rekomendasi Materi</div>
                  <p className="text-ivory/85">
                    Fokus pada kategori: <strong>{latestResult.recommendedCategories.join(', ')}</strong>.
                  </p>
                </div>
              </div>
            </div>
          )}

          <div className="space-y-4">
            {DIAGNOSTIC_QUESTIONS.map((q, idx) => (
              <div key={q.id} className="rounded-2xl bg-ivorySoft border border-charcoal/15 p-5 space-y-3 shadow-card">
                <div className="flex items-center justify-between text-xs font-semibold text-charcoal/65">
                  <span>Soal {idx + 1} dari {DIAGNOSTIC_QUESTIONS.length}</span>
                  <span className="text-coralDark">{q.category}</span>
                </div>
                <h3 className="font-display font-bold text-base sm:text-lg">{q.question}</h3>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                  {q.options.map((opt, optIdx) => {
                    const selected = answers[q.id] === optIdx;
                    return (
                      <button
                        key={optIdx}
                        type="button"
                        onClick={() => handleSelect(q.id, optIdx)}
                        className={`text-left rounded-xl px-4 py-2.5 text-xs sm:text-sm border transition-colors cursor-pointer ${
                          selected
                            ? 'bg-charcoal text-ivory border-charcoal font-semibold'
                            : 'bg-ivory hover:bg-ivoryDeep text-charcoal border-charcoal/15'
                        }`}
                      >
                        {opt}
                      </button>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>

          <div className="flex justify-end">
            <button
              type="button"
              onClick={handleGrade}
              className="rounded-xl bg-coral hover:bg-coralDark text-ivory font-display font-bold text-sm sm:text-base px-7 py-3.5 shadow-card cursor-pointer"
            >
              Selesaikan &amp; Nilai Diagnostik →
            </button>
          </div>
        </div>
      );

    // =========================================================================
    // HALAMAN QUIZ CENTER (/quiz)
    // =========================================================================
    function QuizCenterPage({ progress, onFinishQuiz }) {
      const modes = [
        'Multiple Choice',
        'True or False',
        'Scenario Based Quiz',
        'Identify the Threat',
        'Quick Challenge',
      ];

      const [selectedMode, setSelectedMode] = useState(modes[0]);
      const [qIndex, setQIndex] = useState(0);
      const [pickedOption, setPickedOption] = useState(null);
      const [score, setScore] = useState(0);
      const [secondsLeft, setSecondsLeft] = useState(75);
      const [completedSession, setCompletedSession] = useState(null);

      const modeQuestions = useMemo(() => {
        const filtered = QUIZ_BANK.filter((item) => item.mode === selectedMode);
        return filtered.length ? filtered : QUIZ_BANK.slice(0, 2);
      }, [selectedMode]);

      const startMode = useCallback((m) => {
        setSelectedMode(m);
        setQIndex(0);
        setPickedOption(null);
        setScore(0);
        setSecondsLeft(m === 'Quick Challenge' ? 45 : 75);
        setCompletedSession(null);
      }, []);

      useEffect(() => {
        if (completedSession) return;
        const timer = setInterval(() => {
          setSecondsLeft((prev) => {
            if (prev <= 1) {
              clearInterval(timer);
              const finalScore = score;
              const total = modeQuestions.length;
              const xpEarned = Math.max(15, finalScore * 20);
              const summary = {
                id: `qz-${Date.now()}`,
                mode: selectedMode,
                score: finalScore,
                total,
                xpEarned,
                date: getTodayDateKey(),
              };
              setCompletedSession(summary);
              onFinishQuiz(summary);
              return 0;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, [completedSession, score, modeQuestions.length, selectedMode, onFinishQuiz]);

      const activeQ = modeQuestions[qIndex] || modeQuestions[0];

      function handleChoose(idx) {
        if (pickedOption !== null || completedSession) return;
        setPickedOption(idx);
        const isCorrect = idx === activeQ.correctIndex;
        const nextScore = isCorrect ? score + 1 : score;
        if (isCorrect) {
          setScore(nextScore);
        }

        setTimeout(() => {
          if (qIndex + 1 < modeQuestions.length) {
            setQIndex((i) => i + 1);
            setPickedOption(null);
          } else {
            const total = modeQuestions.length;
            const xpEarned = Math.max(15, nextScore * 20);
            const summary = {
              id: `qz-${Date.now()}`,
              mode: selectedMode,
              score: nextScore,
              total,
              xpEarned,
              date: getTodayDateKey(),
            };
            setCompletedSession(summary);
            onFinishQuiz(summary);
          }
        }, 900);
      }

      return (
        <div className="space-y-6 animate-fade-up">
          <div className="rounded-2xl bg-ivorySoft border border-charcoal/15 p-6 flex flex-wrap items-center justify-between gap-4 shadow-card">
            <div>
              <span className="text-xs font-bold uppercase tracking-widest text-coralDark">QUIZ CENTER</span>
              <h1 className="font-display text-2xl sm:text-3xl font-bold mt-1">
                Pusat Kuis Interaktif XandRE
              </h1>
            </div>
            <div className="rounded-xl bg-charcoal text-ivory px-4 py-2 text-xs sm:text-sm font-bold">
              Timer: <span className="text-coral">{secondsLeft}d</span> • Skor: <span className="text-sage">{score}</span>
            </div>
          </div>

          <div className="flex flex-wrap gap-2">
            {modes.map((m) => (
              <button
                key={m}
                type="button"
                onClick={() => startMode(m)}
                className={`rounded-xl px-3.5 py-2 text-xs font-semibold border cursor-pointer ${
                  selectedMode === m
                    ? 'bg-charcoal text-ivory border-charcoal'
                    : 'bg-ivorySoft hover:bg-ivoryDeep text-charcoal border-charcoal/15'
                }`}
              >
                {m}
              </button>
            ))}
          </div>

          {completedSession ? (
            <div className="rounded-2xl bg-charcoal text-ivory p-6 sm:p-8 space-y-4 shadow-editorial">
              <div className="text-xs font-bold uppercase tracking-wider text-sage">SESI KUIS SELESAI</div>
              <h2 className="font-display text-2xl sm:text-3xl font-bold">
                Skor {completedSession.mode}: {completedSession.score}/{completedSession.total}
              </h2>
              <p className="text-sm text-ivory/80">
                XP diperoleh pada sesi ini: <strong>+{completedSession.xpEarned} XP</strong>.
              </p>
              <button
                type="button"
                onClick={() => startMode(selectedMode)}
                className="rounded-xl bg-coral hover:bg-coralDark text-ivory font-display font-bold text-sm px-5 py-2.5 cursor-pointer"
              >
                Main Lagi Mode Ini
              </button>
            </div>
          ) : (
            <div className="rounded-2xl bg-ivorySoft border border-charcoal/15 p-6 space-y-4 shadow-card">
              <div className="text-xs font-semibold text-charcoal/65">
                {activeQ.mode} • Pertanyaan {qIndex + 1}/{modeQuestions.length}
              </div>
              <h2 className="font-display text-lg sm:text-xl font-bold">{activeQ.question}</h2>
              <div className="space-y-2.5">
                {activeQ.options.map((opt, idx) => {
                  const isPicked = pickedOption === idx;
                  const isRight = idx === activeQ.correctIndex;
                  let cls = 'bg-ivory hover:bg-ivoryDeep text-charcoal border-charcoal/15';
                  if (pickedOption !== null) {
                    if (isRight) cls = 'bg-sage text-charcoal border-sage font-bold';
                    else if (isPicked) cls = 'bg-coral text-ivory border-coral font-bold';
                  }
                  return (
                    <button
                      key={idx}
                      type="button"
                      onClick={() => handleChoose(idx)}
                      className={`w-full text-left rounded-xl px-4 py-3 text-xs sm:text-sm border transition-colors cursor-pointer ${cls}`}
                    >
                      {opt}
                    </button>
                  );
                })}
              </div>

              {pickedOption !== null && (
                <div className="rounded-xl bg-ivory border border-charcoal/15 p-3.5 text-xs sm:text-sm text-charcoal/85">
                  <strong>Penjelasan:</strong> {activeQ.explanation}
                </div>
              )}
            </div>

    // =========================================================================
    // PASSWORD BREAKER ("CAN YOU CRACK THE CODE?")
    // =========================================================================
    function PasswordBreakerPage({ progress, onWinPasswordBreaker }) {
      const [mode, setMode] = useState('classic');
      const [levelIdx, setLevelIdx] = useState(0);
      const [shapeId, setShapeId] = useState('mixed');
      const [secretCode, setSecretCode] = useState(() => generateSecretCode(PB_LEVELS[0], 'classic', 'mixed'));
      const [currentGuess, setCurrentGuess] = useState('');
      const [guesses, setGuesses] = useState([]);
      const [status, setStatus] = useState('playing');
      const [message, setMessage] = useState('');
      const [hintStep, setHintStep] = useState(0);
      const [secondsLeft, setSecondsLeft] = useState(PB_LEVELS[0].timeLimit);
      const [lastWinSummary, setLastWinSummary] = useState(null);

      const levelCfg = PB_LEVELS[levelIdx] || PB_LEVELS[0];
      const codeLength = mode === 'daily' ? 5 : levelCfg.length;
      const maxAttempts = mode === 'daily' ? 8 : levelCfg.maxAttempts;

      const startNewRound = useCallback((nextMode, nextLevelIdx, nextShapeId) => {
        const m = nextMode !== undefined ? nextMode : mode;
        const lIdx = nextLevelIdx !== undefined ? nextLevelIdx : levelIdx;
        const sh = nextShapeId !== undefined ? nextShapeId : shapeId;
        const cfg = PB_LEVELS[lIdx] || PB_LEVELS[0];
        const freshSecret = generateSecretCode(cfg, m, sh);
        setSecretCode(freshSecret);
        setCurrentGuess('');
        setGuesses([]);
        setStatus('playing');
        setMessage('');
        setHintStep(0);
        setSecondsLeft(cfg.timeLimit);
        setLastWinSummary(null);
      }, [mode, levelIdx, shapeId]);

      useEffect(() => {
        if (status !== 'playing') return;
        const interval = setInterval(() => {
          setSecondsLeft((prev) => {
            if (prev <= 1) {
              if (mode === 'time-attack') {
                clearInterval(interval);
                setStatus('lost');
                setMessage(`Waktu habis! Kode tantangan tadi adalah: ${secretCode}`);
                return 0;
              }
              return 0;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(interval);
      }, [status, mode, secretCode]);

      function handleAppendChar(ch) {
        if (status !== 'playing') return;
        if (currentGuess.length < codeLength) {
          setCurrentGuess((prev) => prev + ch);
        }
      }

      function handleBackspace() {
        if (status !== 'playing') return;
        setCurrentGuess((prev) => prev.slice(0, -1));
      }

      function handleUseHint() {
        if (status !== 'playing') return;
        setHintStep((h) => Math.min(3, h + 1));
      }

      function handleSubmitGuess(e) {
        if (e) e.preventDefault();
        if (status !== 'playing') return;
        if (currentGuess.length !== codeLength) {
          setMessage(`Masukkan tepat ${codeLength} karakter kode.`);
          return;
        }

        const evalRes = evaluateMastermindGuess(secretCode, currentGuess);
        const nextGuesses = [
          ...guesses,
          { guess: currentGuess, exact: evalRes.exact, partial: evalRes.partial },
        ];
        setGuesses(nextGuesses);
        setCurrentGuess('');
        setMessage('');

        if (evalRes.exact === codeLength) {
          setStatus('won');
          const attemptsUsed = nextGuesses.length;
          const hintPenalty = mode === 'hint' ? hintStep * 25 : hintStep * 15;
          const speedBonus = mode === 'time-attack' ? Math.max(20, Math.round(secondsLeft * 0.5)) : 0;
          const attemptBonus = Math.max(10, (maxAttempts - attemptsUsed + 1) * 15);
          const rawScore = Math.max(50, levelCfg.baseXp * 2 + attemptBonus + speedBonus - hintPenalty);
          const xpReward = Math.max(30, levelCfg.baseXp + (mode === 'time-attack' ? 25 : 0) - hintStep * 10);

          const summary = {
            secret: secretCode,
            attemptsUsed,
            score: rawScore,
            xpReward,
            mode,
            level: levelCfg.label,
          };
          setLastWinSummary(summary);
          onWinPasswordBreaker(summary);
        } else if (nextGuesses.length >= maxAttempts) {
          setStatus('lost');
          setMessage(`Kesempatan habis! Kode tantangan adalah: ${secretCode}`);
        }
      }

      const composition = useMemo(() => analyzeSecretComposition(secretCode), [secretCode]);

      const keypadChars = useMemo(() => {
        return buildPasswordPool(levelCfg, mode, shapeId).split('');
      }, [levelCfg, mode, shapeId]);

      return (
        <div className="rounded-2xl bg-charcoal text-ivory p-5 sm:p-8 space-y-6 shadow-editorial animate-fade-up">
          <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-4 border-b border-ivory/15 pb-5">
            <div>
              <span className="inline-block px-3 py-1 rounded-full bg-coral text-ivory text-xs font-bold uppercase tracking-widest">
                PEMECAH SANDI (PASSWORD BREAKER)
              </span>
              <h1 className="font-display text-3xl sm:text-4xl font-bold tracking-tight mt-2">
                CAN YOU CRACK THE CODE?
              </h1>
              <p className="text-xs sm:text-sm text-ivory/75 mt-1">
                Permainan tebak kode tantangan bergaya Mastermind (tanpa meminta atau menyimpan sandi pribadimu).
              </p>
            </div>

            <div className="flex flex-wrap items-center gap-3 text-xs font-bold">
              <div className="rounded-xl bg-charcoalSoft border border-ivory/15 px-3.5 py-2.5">
                Waktu: <span className="text-coral">{secondsLeft}d</span>
              </div>
              <div className="rounded-xl bg-charcoalSoft border border-ivory/15 px-3.5 py-2.5">
                Percobaan: <span className="text-sage">{guesses.length}/{maxAttempts}</span>
              </div>
              <div className="rounded-xl bg-charcoalSoft border border-ivory/15 px-3.5 py-2.5">
                Skor Terbaik: <span className="text-sage">{progress.passwordBreaker?.bestScore || 0}</span>
              </div>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-4">
            <div className="lg:col-span-7 space-y-2">
              <div className="text-[11px] font-bold uppercase tracking-widest text-ivory/60">MODE PERMAINAN</div>
              <div className="flex flex-wrap gap-2">
                {[
                  { id: 'classic', label: 'CLASSIC MODE' },
                  { id: 'hint', label: 'HINT MODE' },
                  { id: 'time-attack', label: 'TIME ATTACK' },
                  { id: 'daily', label: 'DAILY PASSWORD CHALLENGE' },
                ].map((m) => (
                  <button
                    key={m.id}
                    type="button"
                    onClick={() => startNewRound(m.id, levelIdx, shapeId)}
                    className={`rounded-xl px-3.5 py-2 text-xs font-display font-semibold border transition-colors cursor-pointer ${
                      mode === m.id
                        ? 'bg-coral text-ivory border-coral'
                        : 'bg-charcoalSoft text-ivory/85 border-ivory/15 hover:border-ivory/40'
                    }`}
                  >
                    {m.label}
                  </button>
                ))}
              </div>
            </div>

            <div className="lg:col-span-5 space-y-2">
              <div className="text-[11px] font-bold uppercase tracking-widest text-ivory/60">
                LEVEL ({levelCfg.label})
              </div>
              <div className="flex flex-wrap gap-1.5">
                {PB_LEVELS.map((lv, idx) => (
                  <button

            </div>
            <div className="flex flex-wrap gap-1.5">
              {PB_SHAPES.map((sh) => (
                <button
                  key={sh.id}
                  type="button"
                  onClick={() => {
                    setShapeId(sh.id);
                    startNewRound(mode, levelIdx, sh.id);
                  }}
                  className={`rounded-lg px-3 py-1.5 text-xs font-semibold border transition-colors cursor-pointer ${
                    shapeId === sh.id
                      ? 'bg-coral text-ivory border-coral'
                      : 'bg-charcoalSoft text-ivory/80 border-ivory/15 hover:border-ivory/40'
                  }`}
                >
                  {sh.label}
                </button>
              ))}
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            <div className="lg:col-span-7 rounded-2xl bg-charcoalSoft border border-ivory/15 p-5 sm:p-6 space-y-5">
              <div className="flex items-center justify-between">
                <span className="text-xs font-semibold text-ivory/70">
                  Panjang Kode: {codeLength} Karakter
                </span>
                {mode === 'daily' && (
                  <span className="text-xs text-sage font-semibold">
                    Tantangan Harian ({getTodayDateKey()})
                  </span>
                )}
              </div>

              <div className="flex flex-wrap items-center justify-center gap-2.5 py-2">
                {Array.from({ length: codeLength }).map((_, idx) => {
                  const charVal = currentGuess[idx] || '';
                  return (
                    <div
                      key={idx}
                      className={`w-11 h-12 sm:w-12 sm:h-14 rounded-xl border-2 flex items-center justify-center font-display text-xl sm:text-2xl font-bold transition-all ${
                        charVal
                          ? 'bg-ivory text-charcoal border-coral animate-slot-pop'
                          : 'bg-charcoal/70 text-ivory/35 border-ivory/25'
                      }`}
                    >
                      {charVal || '•'}
                    </div>
                  );
                })}
              </div>

              <form onSubmit={handleSubmitGuess} className="space-y-3">
                <input
                  type="text"
                  maxLength={codeLength}
                  value={currentGuess}
                  onChange={(e) => {
                    if (status !== 'playing') return;
                    const allowed = new Set(keypadChars);
                    const filtered = e.target.value
                      .split('')
                      .filter((c) => allowed.has(c))
                      .join('')
                      .slice(0, codeLength);
                    setCurrentGuess(filtered);
                  }}
                  placeholder={`Ketik ${codeLength} karakter atau gunakan tombol di bawah...`}
                  className="w-full rounded-xl bg-charcoal border border-ivory/25 focus:border-coral focus:outline-none px-4 py-2.5 text-sm text-ivory font-mono tracking-widest text-center"
                />

                <div className="flex flex-wrap items-center justify-center gap-2.5">
                  <button
                    type="submit"
                    disabled={status !== 'playing'}
                    className="rounded-xl bg-coral hover:bg-coralDark disabled:opacity-45 text-ivory font-display font-bold text-sm px-5 py-2.5 cursor-pointer"
                  >
                    Submit
                  </button>
                  <button
                    type="button"
                    onClick={handleBackspace}
                    disabled={status !== 'playing'}
                    className="rounded-xl bg-charcoal hover:bg-ivory/10 text-ivory border border-ivory/25 text-xs font-semibold px-3.5 py-2.5 cursor-pointer"
                  >
                    Hapus
                  </button>
                  <button
                    type="button"
                    onClick={handleUseHint}
                    disabled={status !== 'playing' || hintStep >= 3}
                    className="rounded-xl bg-sage/20 hover:bg-sage/30 disabled:opacity-45 text-sage border border-sage/40 text-xs font-bold px-4 py-2.5 cursor-pointer"
                  >
                    Hint ({hintStep}/3)
                  </button>
                  <button
                    type="button"
                    onClick={() => startNewRound(mode, levelIdx, shapeId)}
                    className="rounded-xl bg-charcoal hover:bg-ivory/10 text-ivory/85 border border-ivory/20 text-xs font-semibold px-4 py-2.5 cursor-pointer"
                  >
                    Reset
                  </button>
                </div>
              </form>

              <div className="pt-2">
                <div className="text-[11px] text-ivory/60 mb-2">Papan Karakter Tersedia:</div>
                <div className="flex flex-wrap gap-1.5 max-h-28 overflow-y-auto p-1">
                  {keypadChars.map((ch, i) => (
                    <button
                      key={`${ch}-${i}`}
                      type="button"
                      onClick={() => handleAppendChar(ch)}
                      disabled={status !== 'playing' || currentGuess.length >= codeLength}
                      className="w-8 h-8 rounded-lg bg-charcoal hover:bg-coral text-ivory border border-ivory/15 font-mono text-xs font-bold transition-colors cursor-pointer disabled:opacity-40"
                    >
                      {ch}
                    </button>
                  ))}
                </div>
              </div>

              {message && (
                <div className="rounded-xl bg-coral/20 border border-coral px-4 py-3 text-xs sm:text-sm font-medium text-ivory animate-fade-up">
                  {message}
                </div>
              )}

              {status === 'won' && lastWinSummary && (
                <div className="rounded-xl bg-sage/25 border border-sage p-4 space-y-1.5 animate-fade-up">
                  <div className="font-display font-bold text-lg text-sage">
                    KODE TERPECAHKAN! ({lastWinSummary.secret})
                  </div>
                  <p className="text-xs sm:text-sm text-ivory/90">
                    Selesai dalam <strong>{lastWinSummary.attemptsUsed}</strong> percobaan • Skor:{' '}
                    <strong>{lastWinSummary.score}</strong> • +{lastWinSummary.xpReward} XP
                  </p>
                </div>
              )}
            </div>

            <div className="lg:col-span-5 space-y-4">
              <div className="rounded-2xl bg-charcoalSoft border border-ivory/15 p-5 space-y-2.5">
                <h2 className="font-display text-base font-bold text-sage">Panel Petunjuk Sistem</h2>
                <p className="text-xs text-ivory/75 leading-relaxed">
                  <strong>Tepat (Sage):</strong> karakter benar &amp; posisi benar.{' '}
                  <strong>Sebagian (Coral):</strong> karakter ada di kode, posisi berbeda.
                </p>
                <div className="text-xs text-ivory/85 space-y-1 pt-1">
                  <div>• Petunjuk 1: Panjang kode = <strong>{composition.length} karakter</strong>.</div>
                  {(mode === 'hint' || hintStep >= 1) && (
                    <div>• Jenis karakter: <strong>{composition.types.join(', ')}</strong>.</div>
                  )}
                  {hintStep >= 2 && (
                    <div>
                      • Komposisi: Huruf kapital ({composition.hasUpper ? 'Ya' : 'Tidak'}), Angka (
                      {composition.hasDigit ? 'Ya' : 'Tidak'}), Simbol ({composition.hasSymbol ? 'Ya' : 'Tidak'}).
                    </div>
                  )}
                  {hintStep >= 3 && (
                    <div className="text-coral font-semibold">
                      • Karakter pertama dimulai dengan: &ldquo;{composition.firstCharPreview}&rdquo;
                    </div>
                  )}
                </div>
              </div>

              <div className="rounded-2xl bg-charcoalSoft border border-ivory/15 p-5 space-y-3">
                <h3 className="font-display text-base font-bold">Riwayat Tebakan</h3>
                {guesses.length === 0 ? (
                  <p className="text-xs text-ivory/60">Belum ada tebakan pada ronde ini.</p>
                ) : (
                  <div className="space-y-2 max-h-60 overflow-y-auto pr-1">
                    {guesses.map((g, idx) => (
                      <div
                        key={idx}
                        className="rounded-xl bg-charcoal border border-ivory/10 px-3.5 py-2.5 flex items-center justify-between gap-2 text-xs"
                      >
                        <span className="font-mono font-bold tracking-widest text-sm">{g.guess}</span>
                        <div className="flex items-center gap-2 shrink-0">
                          <span className="px-2 py-0.5 rounded bg-sage/25 text-sage font-bold">
                            Tepat: {g.exact}
                          </span>
                          <span className="px-2 py-0.5 rounded bg-coral/25 text-coral font-bold">
                            Sebagian: {g.partial}
                          </span>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          </div>

          <div className="rounded-2xl bg-charcoalSoft border border-ivory/15 p-6 space-y-3">
            <h2 className="font-display text-lg font-bold text-ivory">
              Edukasi Keamanan Sandi Setelah Permainan
            </h2>
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 text-xs sm:text-sm text-ivory/80">
              <div className="rounded-xl bg-charcoal p-3.5 border border-ivory/10">
                <div className="font-bold text-coral mb-1">Mengapa Sandi Mudah/Sulit Ditebak</div>
                Sandi pendek atau umum cepat ditebak, sedangkan kombinasi panjang dan bervariasi memperluas jumlah kemungkinan.
              </div>
              <div className="rounded-xl bg-charcoal p-3.5 border border-ivory/10">
                <div className="font-bold text-sage mb-1">Pentingnya Panjang &amp; Keunikan</div>
                Utamakan sandi panjang dan unik di tiap akun—jangan mendaur ulang satu sandi untuk semua layanan.
              </div>
              <div className="rounded-xl bg-charcoal p-3.5 border border-ivory/10">
                <div className="font-bold text-coral mb-1">Password Manager &amp; MFA</div>
                Gunakan password manager tepercaya serta aktifkan Multi-Factor Authentication (MFA/2FA) sebagai lapisan pelindung tambahan.
              </div>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // VIDEO LIBRARY ("LESS READING. MORE LEARNING.")
    // =========================================================================
    function VideoLibraryPage({
      progress,
      activeVideoId,
      onSelectVideoId,
      onToggleFavoriteVideo,
      onMarkVideoWatched,
    }) {
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('Semua');
      const [difficultyFilter, setDifficultyFilter] = useState('Semua');
      const [sortNewest, setSortNewest] = useState(true);

      const selectedVideo = useMemo(() => {
        if (!activeVideoId) return null;
        return CURATED_VIDEOS.find((v) => v.id === activeVideoId) || null;
      }, [activeVideoId]);

      const filteredVideos = useMemo(() => {
        const q = searchQuery.trim().toLowerCase();
        const list = CURATED_VIDEOS.filter((v) => {
          const catMatch = selectedCategory === 'Semua' || v.category === selectedCategory;
          const diffMatch = difficultyFilter === 'Semua' || v.difficulty === difficultyFilter;
          const searchMatch =
            !q ||
            v.title.toLowerCase().includes(q) ||
            v.description.toLowerCase().includes(q) ||
            v.channel.toLowerCase().includes(q) ||
            v.category.toLowerCase().includes(q);
          return catMatch && diffMatch && searchMatch;
        });
        return list.sort((a, b) => (sortNewest ? b.addedOrder - a.addedOrder : a.addedOrder - b.addedOrder));
      }, [searchQuery, selectedCategory, difficultyFilter, sortNewest]);

      if (selectedVideo) {
        const idx = CURATED_VIDEOS.findIndex((v) => v.id === selectedVideo.id);
        const prevVideo = CURATED_VIDEOS[(idx - 1 + CURATED_VIDEOS.length) % CURATED_VIDEOS.length];
        const nextVideo = CURATED_VIDEOS[(idx + 1) % CURATED_VIDEOS.length];
        const isWatched = (progress.watchedVideos || []).includes(selectedVideo.id);
        const isFav = (progress.favoriteVideos || []).includes(selectedVideo.id);
        const related = CURATED_VIDEOS.filter((v) => v.id !== selectedVideo.id);

        return (
          <div className="space-y-6 animate-fade-up">
            <div className="flex flex-wrap items-center justify-between gap-3">
              <button
                type="button"
                onClick={() => onSelectVideoId(null)}
                className="rounded-xl bg-ivorySoft hover:bg-ivoryDeep border border-charcoal/20 font-display font-semibold text-sm px-4 py-2 cursor-pointer"
              >
                ← Back to Library
              </button>

              <div className="flex flex-wrap gap-2">
                <button
                  type="button"
                  onClick={() => onToggleFavoriteVideo(selectedVideo.id)}
                  className={`rounded-xl px-4 py-2 text-xs font-bold border cursor-pointer ${
                    isFav
                      ? 'bg-coral text-ivory border-coral'
                      : 'bg-ivorySoft text-charcoal border-charcoal/20'
                  }`}
                >
                  {isFav ? '★ Favorit' : '☆ Favoritkan'}
                </button>

                <button
                  type="button"
                  onClick={() => onMarkVideoWatched(selectedVideo.id)}
                  className={`rounded-xl px-4 py-2 text-xs font-bold cursor-pointer ${
                    isWatched
                      ? 'bg-sage text-charcoal'
                      : 'bg-charcoal hover:bg-charcoalSoft text-ivory'
                  }`}
                >
                  {isWatched ? '✓ Mark as Watched' : 'Mark as Watched (+45 XP)'}
                </button>

                <a
                  href={`https://www.youtube.com/watch?v=${selectedVideo.youtubeId}`}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="rounded-xl bg-ivoryDeep hover:bg-sage/40 text-charcoal text-xs font-bold px-4 py-2 inline-flex items-center"
                >
                  Watch on YouTube ↗
                </a>
              </div>
            </div>

            <YouTubePlayer
              videoId={selectedVideo.youtubeId}
              title={selectedVideo.title}
              onComplete={() => {
                if (!isWatched) {
                  onMarkVideoWatched(selectedVideo.id);
                }
              }}
            />

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
              <div className="lg:col-span-8 rounded-2xl bg-ivorySoft border border-charcoal/15 p-6 space-y-4">
                <div className="flex flex-wrap items-center gap-2 text-xs font-semibold">
                  <span className="px-2.5 py-1 rounded-md bg-coral/15 text-coralDark">
                    {selectedVideo.category}
                  </span>
                  <span className="px-2.5 py-1 rounded-md bg-ivoryDeep text-charcoal">
                    {selectedVideo.difficulty}
                  </span>
                  <span className="text-charcoal/65">Durasi: {selectedVideo.duration}</span>
                </div>

                <h1 className="font-display text-2xl sm:text-3xl font-bold">{selectedVideo.title}</h1>
                <div className="text-sm font-medium text-charcoal/70">Channel: {selectedVideo.channel}</div>
                <p className="text-sm sm:text-base text-charcoal/85 leading-relaxed">{selectedVideo.description}</p>

                <div className="rounded-xl bg-ivory border border-charcoal/15 p-4 space-y-1.5">
                  <div className="font-display font-bold text-sm">Poin Utama Video</div>
                  <ul className="list-disc pl-5 text-sm text-charcoal/80 space-y-1">
                    {selectedVideo.keyTakeaways.map((kt, i) => (
                      <li key={i}>{kt}</li>
                    ))}
                  </ul>
                </div>

                <div className="pt-2 flex justify-between gap-3">
                  <button
                    type="button"
                    onClick={() => onSelectVideoId(prevVideo.id)}
                    className="rounded-xl bg-ivory hover:bg-ivoryDeep border border-charcoal/20 text-xs font-semibold px-4 py-2.5 cursor-pointer"
                  >
                    ← Previous
                  </button>
                  <button
                    type="button"
                    onClick={() => onSelectVideoId(nextVideo.id)}
                    className="rounded-xl bg-charcoal hover:bg-charcoalSoft text-ivory text-xs font-semibold px-4 py-2.5 cursor-pointer"
                  >
                    Next →
                  </button>
                </div>
              </div>

              <aside className="lg:col-span-4 rounded-2xl bg-ivorySoft border border-charcoal/15 p-5 space-y-3">
                <h2 className="font-display text-lg font-bold">Video Terkait</h2>
                <div className="space-y-3">
                  {related.map((rv) => (
                    <button
                      key={rv.id}
                      type="button"
                      onClick={() => onSelectVideoId(rv.id)}
                      className="w-full text-left rounded-xl bg-ivory hover:bg-ivoryDeep/70 border border-charcoal/15 p-3 flex gap-3 items-center transition-colors cursor-pointer"
                    >
                      <img
                        src={`https://img.youtube.com/vi/${rv.youtubeId}/hqdefault.jpg`}
                        alt={rv.title}
                        className="w-24 h-16 object-cover rounded-lg shrink-0 bg-charcoal"
                      />
                      <div className="min-w-0">
                        <div className="text-[11px] font-semibold text-coralDark">{rv.category}</div>
                        <div className="font-display font-bold text-xs sm:text-sm line-clamp-2">{rv.title}</div>
                      </div>
                    </button>
                  ))}
                </div>
              </aside>
            </div>
          </div>
        );
      }

      const featuredVideos = CURATED_VIDEOS.filter((v) => v.featured);
      const recentlyWatched = (progress.recentlyWatchedVideos || [])
        .map((id) => CURATED_VIDEOS.find((v) => v.id === id))
        .filter(Boolean);
      const continueVideos = CURATED_VIDEOS.filter(
        (v) => !(progress.watchedVideos || []).includes(v.id)
      );

      return (
        <div className="space-y-8 animate-fade-up">
          <section className="rounded-2xl bg-ivorySoft border border-charcoal/15 p-6 sm:p-8 space-y-4 shadow-editorial">
            <div className="flex flex-wrap items-center justify-between gap-2">
              <span className="px-3 py-1 rounded-full bg-coral/15 text-coralDark text-xs font-bold uppercase tracking-widest">
                LESS READING. MORE LEARNING.
              </span>
              <span className="text-xs font-semibold text-charcoal/70">
                Selesai Ditonton: {(progress.watchedVideos || []).length}/{CURATED_VIDEOS.length}
              </span>
            </div>

            <h1 className="font-display text-3xl sm:text-4xl font-bold">
              Learn It. Watch It. Understand It.
            </h1>

            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 pt-2">
              <input
                type="search"
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                placeholder="Cari video, topik, atau channel..."
                className="lg:col-span-2 rounded-xl bg-ivory border border-charcoal/20 focus:border-coral focus:outline-none px-4 py-2.5 text-sm"
              />
              <select
                value={difficultyFilter}
                onChange={(e) => setDifficultyFilter(e.target.value)}
                aria-label="Filter tingkat kesulitan video"
                className="rounded-xl bg-ivory border border-charcoal/20 px-3 py-2.5 text-sm"
              >
                <option value="Semua">Semua Level</option>
                <option value="Pemula">Pemula</option>
                <option value="Menengah">Menengah</option>
                <option value="Lanjutan">Lanjutan</option>
              </select>
              <button
                type="button"
                onClick={() => setSortNewest((s) => !s)}
                className="rounded-xl bg-charcoal text-ivory text-xs sm:text-sm font-semibold px-4 py-2.5 cursor-pointer"
              >
                Urutan: {sortNewest ? 'Terbaru' : 'Urutan Awal'}
              </button>
            </div>
          </section>

          <div className="flex flex-wrap gap-2">
            <button
              type="button"
              onClick={() => setSelectedCategory('Semua')}
              className={`rounded-full px-3.5 py-1.5 text-xs font-semibold cursor-pointer ${
                selectedCategory === 'Semua'
                  ? 'bg-charcoal text-ivory'
                  : 'bg-ivorySoft hover:bg-ivoryDeep text-charcoal border border-charcoal/15'
              }`}
            >
              Semua Kategori
            </button>
            {VIDEO_CATEGORIES.map((cat) => (
              <button
                key={cat}
                type="button"
                onClick={() => setSelectedCategory(cat)}
                className={`rounded-full px-3.5 py-1.5 text-xs font-semibold cursor-pointer ${
                  selectedCategory === cat
                    ? 'bg-coral text-ivory'
                    : 'bg-ivorySoft hover:bg-ivoryDeep text-charcoal border border-charcoal/15'
                }`}
              >
                {cat}
              </button>
            ))}
          </div>

          {filteredVideos.length === 0 ? (
            <div className="rounded-2xl bg-ivorySoft border border-dashed border-charcoal/30 p-10 text-center space-y-2">
              <div className="font-display text-2xl font-bold text-charcoal">
                NO VIDEOS YET. WE&apos;RE WORKING ON IT.
              </div>
              <p className="text-sm text-charcoal/70 max-w-md mx-auto">
                Belum ada video untuk kategori atau kata kunci ini. Coba kategori lain atau bersihkan pencarian.
              </p>
            </div>
          ) : (
            <section className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
              {filteredVideos.map((vid) => {
                const watched = (progress.watchedVideos || []).includes(vid.id);
                const fav = (progress.favoriteVideos || []).includes(vid.id);
                return (
                  <div
                    key={vid.id}
                    className="rounded-2xl bg-ivorySoft border border-charcoal/15 overflow-hidden flex flex-col justify-between shadow-card"
                  >
                    <div>
                      <div
                        onClick={() => onSelectVideoId(vid.id)}
                        className="relative aspect-video bg-charcoal cursor-pointer overflow-hidden group"
                      >
                        <img
                          src={`https://img.youtube.com/vi/${vid.youtubeId}/hqdefault.jpg`}
                          alt={vid.title}
                          className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
                        />
                        <span className="absolute bottom-2 right-2 rounded bg-charcoal/90 text-ivory text-[11px] font-mono px-2 py-0.5">
                          {vid.duration}
                        </span>
                      </div>

                      <div className="p-5 space-y-2">
                        <div className="flex items-center justify-between gap-2 text-[11px] font-bold">
                          <span className="text-coralDark">{vid.category}</span>
                          <span className={watched ? 'text-sageDark' : 'text-charcoal/60'}>
                            {watched ? '✓ Watched' : vid.difficulty}
                          </span>
                        </div>
                        <h2 className="font-display font-bold text-base leading-snug">{vid.title}</h2>
                        <div className="text-xs text-charcoal/65">{vid.channel}</div>
                        <p className="text-xs text-charcoal/75 line-clamp-2 leading-relaxed">{vid.description}</p>
                      </div>
                    </div>

                    <div className="px-5 pb-5 pt-2 flex items-center justify-between gap-2">
                      <button
                        type="button"
                        onClick={() => onSelectVideoId(vid.id)}
                        className="flex-1 rounded-xl bg-charcoal hover:bg-charcoalSoft text-ivory font-display font-semibold text-xs py-2.5 px-3 cursor-pointer"
                      >
                        Putar Video →
                      </button>
                      <button
                        type="button"
                        onClick={() => onToggleFavoriteVideo(vid.id)}
                        aria-label="Toggle favorit video"
                        className={`rounded-xl px-3 py-2.5 text-xs font-bold border cursor-pointer ${
                          fav ? 'bg-coral text-ivory border-coral' : 'bg-ivory text-charcoal border-charcoal/20'
                        }`}
                      >
                        {fav ? '★' : '☆'}
                      </button>
                    </div>
                  </div>
                );
              })}
            </section>
          )}

          <section className="grid grid-cols-1 lg:grid-cols-3 gap-5">
            <div className="rounded-2xl bg-ivorySoft border border-charcoal/15 p-5 space-y-2.5">
              <h3 className="font-display font-bold text-base">Featured Videos</h3>
              {featuredVideos.map((fv) => (
                <button
                  key={fv.id}
                  type="button"
                  onClick={() => onSelectVideoId(fv.id)}
                  className="w-full text-left rounded-xl bg-ivory hover:bg-ivoryDeep/70 p-3 text-xs font-semibold flex justify-between items-center cursor-pointer"
                >
                  <span className="truncate pr-2">{fv.title}</span>
                  <span className="text-coralDark shrink-0">Putar</span>
                </button>
              ))}
            </div>

            <div className="rounded-2xl bg-ivorySoft border border-charcoal/15 p-5 space-y-2.5">
              <h3 className="font-display font-bold text-base">Continue Learning</h3>
              {continueVideos.length > 0 ? (
                continueVideos.map((cv) => (
                  <button
                    key={cv.id}
                    type="button"
                    onClick={() => onSelectVideoId(cv.id)}
                    className="w-full text-left rounded-xl bg-ivory hover:bg-ivoryDeep/70 p-3 text-xs font-semibold flex justify-between items-center cursor-pointer"
                  >
                    <span className="truncate pr-2">{cv.title}</span>
                    <span className="text-charcoal/60 shrink-0">{cv.duration}</span>
                  </button>
                ))

    // =========================================================================
    // HALAMAN CHALLENGES (/challenges)
    // =========================================================================
    function ChallengesPage({ progress, onClaimChallenge }) {
      const [statusNote, setStatusNote] = useState({});

      function isChallengeConditionMet(ch) {
        if (ch.checkType === 'lesson_or_pb') {
          return (
            (progress.completedLessons || []).length >= 1 ||
            ((progress.passwordBreaker && progress.passwordBreaker.wins) || 0) >= 1
          );
        }
        if (ch.checkType === 'xp_150') {
          return (progress.xp || 0) >= 150;
        }
        if (ch.checkType === 'cyber_lab_any') {
          return (progress.completedCyberLabs || []).length >= 1;
        }
        if (ch.checkType === 'pb_win') {
          return ((progress.passwordBreaker && progress.passwordBreaker.wins) || 0) >= 1;
        }
        if (ch.checkType === 'assessment_or_quiz') {
          return (
            (progress.diagnosticHistory || []).length >= 1 || (progress.quizHistory || []).length >= 1
          );
        }
        return false;
      }

      function handleTryClaim(ch) {
        const already = (progress.completedChallenges || []).includes(ch.id);
        if (already) {
          setStatusNote((s) => ({ ...s, [ch.id]: 'Tantangan ini sudah diselesaikan.' }));
          return;
        }
        if (!isChallengeConditionMet(ch)) {
          setStatusNote((s) => ({
            ...s,
            [ch.id]: 'Syarat tantangan belum terpenuhi. Selesaikan aktivitas terkait terlebih dahulu!',
          }));
          return;
        }
        onClaimChallenge(ch);
        setStatusNote((s) => ({
          ...s,
          [ch.id]: `Tantangan selesai! +${ch.xp} XP ditambahkan.`,
        }));
      }

      return (
        <div className="space-y-6 animate-fade-up">
          <div className="rounded-2xl bg-ivorySoft border border-charcoal/15 p-6 shadow-card">
            <span className="text-xs font-bold uppercase tracking-widest text-coralDark">CHALLENGES</span>
            <h1 className="font-display text-2xl sm:text-3xl font-bold mt-1">
              Tantangan &amp; Misi Keamanan Digital
            </h1>
            <p className="text-xs sm:text-sm text-charcoal/70 mt-1">
              Selesaikan syarat tantangan untuk mendapatkan bonus XP dan mendukung lencana pencapaian.
            </p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
            {CHALLENGES_LIST.map((ch) => {
              const done = (progress.completedChallenges || []).includes(ch.id);
              const eligible = isChallengeConditionMet(ch);
              return (
                <div
                  key={ch.id}
                  className="rounded-2xl bg-ivorySoft border border-charcoal/15 p-6 flex flex-col justify-between gap-4 shadow-card"
                >
                  <div className="space-y-2">
                    <div className="flex items-center justify-between text-xs font-bold">
                      <span className="px-2.5 py-0.5 rounded-full bg-ivoryDeep text-charcoal">{ch.type}</span>
                      <span className="text-coralDark">+{ch.xp} XP • {ch.difficulty}</span>
                    </div>
                    <h2 className="font-display text-xl font-bold">{ch.title}</h2>
                    <p className="text-sm text-charcoal/80">{ch.description}</p>
                    <p className="text-xs text-charcoal/65 bg-ivory rounded-xl p-3 border border-charcoal/10">
                      <strong>Instruksi:</strong> {ch.instructions}
                    </p>
                  </div>

                  <div className="space-y-2">
                    <div className="flex items-center justify-between text-xs">
                      <span className="text-charcoal/65">Badge terkait: {ch.badgeHint}</span>
                      <span className={done ? 'text-sageDark font-bold' : eligible ? 'text-coralDark font-bold' : 'text-charcoal/50'}>
                        {done ? '✓ Selesai' : eligible ? 'Siap Diklaim' : 'Dalam Proses'}
                      </span>
                    </div>

                    <button
                      type="button"
                      onClick={() => handleTryClaim(ch)}
                      className={`w-full rounded-xl py-2.5 px-4 font-display font-semibold text-sm cursor-pointer ${
                        done
                          ? 'bg-sage/40 text-charcoal'
                          : 'bg-coral hover:bg-coralDark text-ivory'
                      }`}
                    >
                      {done ? 'Tantangan Selesai ✓' : 'Verifikasi & Klaim Tantangan'}
                    </button>

                    {statusNote[ch.id] && (
                      <p className="text-xs font-medium text-charcoal/80 pt-1">{statusNote[ch.id]}</p>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }
